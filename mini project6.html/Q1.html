<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aria Vance | Manage Music Links</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-dark: #0f0c20;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent: #8a2be2;
      --accent-glow: #e056fd;
      --text-main: #f5f5f7;
      --text-muted: #a1a1a6;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      padding-top: 76px;
    }

    /* Ambient Background Glows */
    body::before {
      content: '';
      position: fixed;
      width: 350px;
      height: 350px;
      background: var(--accent);
      border-radius: 50%;
      filter: blur(140px);
      top: 10%;
      left: 10%;
      z-index: -1;
      opacity: 0.4;
    }

    body::after {
      content: '';
      position: fixed;
      width: 350px;
      height: 350px;
      background: var(--accent-glow);
      border-radius: 50%;
      filter: blur(140px);
      bottom: 10%;
      right: 10%;
      z-index: -1;
      opacity: 0.25;
    }

    /* Glass Panels */
    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* Glass Form Inputs */
    .input-group-text {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-right: none;
      font-size: 1.2rem;
    }

    .glass-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      border-radius: 0 10px 10px 0;
      padding: 12px;
    }

    .glass-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-glow);
      color: var(--text-main);
      box-shadow: 0 0 10px rgba(224, 86, 253, 0.3);
    }

    .glass-input::placeholder {
      color: var(--text-muted);
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent), var(--accent-glow));
      color: #fff;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 12px;
      transition: opacity 0.3s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
      color: #fff;
    }

    /* Platform Preview Card Styles */
    .preview-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .preview-card:hover {
      transform: translateY(-4px);
    }

    .platform-spotify { border-left: 4px solid #1db954; }
    .platform-youtube { border-left: 4px solid #ff0000; }
    .platform-apple { border-left: 4px solid #fa233b; }

    .btn-platform {
      color: #fff;
      font-weight: 600;
      border-radius: 30px;
      padding: 8px 18px;
      border: none;
      font-size: 0.85rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s ease;
    }

    .btn-platform:hover { color: #fff; opacity: 0.85; }
    .btn-spotify { background-color: #1db954; }
    .btn-youtube { background-color: #ff0000; }
    .btn-apple { background-color: #fa243c; }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }
  </style>
</head>
<body>

  <main class="container my-5" style="max-width: 800px;">
    
    <!-- Music Links Form Section -->
    <div class="glass-panel p-4 p-md-5 mb-5">
      <h2 class="section-title text-light mb-2">Music Platform Links</h2>
      <p class="text-secondary small mb-4">Enter profile or artist URLs to dynamically generate streaming preview cards.</p>

      <form id="musicLinksForm">
        <!-- Spotify Input -->
        <div class="mb-3">
          <label for="spotifyUrl" class="form-label text-light small fw-bold">Spotify Profile URL</label>
          <div class="input-group">
            <span class="input-group-text text-success"><i class="bi bi-spotify"></i></span>
            <input type="url" class="form-control glass-input" id="spotifyUrl" placeholder="https://open.spotify.com/artist/..." required>
          </div>
        </div>

        <!-- YouTube Music Input -->
        <div class="mb-3">
          <label for="youtubeUrl" class="form-label text-light small fw-bold">YouTube Music Profile URL</label>
          <div class="input-group">
            <span class="input-group-text text-danger"><i class="bi bi-youtube"></i></span>
            <input type="url" class="form-control glass-input" id="youtubeUrl" placeholder="https://music.youtube.com/channel/..." required>
          </div>
        </div>

        <!-- Apple Music Input -->
        <div class="mb-4">
          <label for="appleUrl" class="form-label text-light small fw-bold">Apple Music Profile URL</label>
          <div class="input-group">
            <span class="input-group-text" style="color: #fa233b;"><i class="bi bi-apple"></i></span>
            <input type="url" class="form-control glass-input" id="appleUrl" placeholder="https://music.apple.com/artist/..." required>
          </div>
        </div>

        <button type="submit" class="btn btn-submit w-100">Update Profile Links</button>
      </form>
    </div>

    <!-- Generated Preview Cards Container -->
    <div id="previewContainer" class="d-none">
      <h3 class="section-title text-light mb-4 text-center">Live Streaming Previews</h3>
      
      <div class="row g-4" id="cardsGrid">
        <!-- Cards inserted dynamically via JavaScript -->
      </div>
    </div>

  </main>

  <!-- JavaScript to Handle Form Submission & Dynamic Card Generation -->
  <script>
    document.getElementById('musicLinksForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const spotifyVal = document.getElementById('spotifyUrl').value.trim();
      const youtubeVal = document.getElementById('youtubeUrl').value.trim();
      const appleVal = document.getElementById('appleUrl').value.trim();

      const cardsGrid = document.getElementById('cardsGrid');
      cardsGrid.innerHTML = ''; // Clear previous preview cards

      const platforms = [
        {
          name: 'Spotify',
          url: spotifyVal,
          icon: 'bi-spotify',
          classSuffix: 'spotify',
          desc: 'Stream full discography, top tracks, and curated artist playlists.'
        },
        {
          name: 'YouTube Music',
          url: youtubeVal,
          icon: 'bi-youtube',
          classSuffix: 'youtube',
          desc: 'Watch official music videos, live performances, and audio uploads.'
        },
        {
          name: 'Apple Music',
          url: appleVal,
          icon: 'bi-apple',
          classSuffix: 'apple',
          desc: 'Listen to lossless audio releases and exclusive radio interviews.'
        }
      ];

      platforms.forEach(p => {
        if (p.url) {
          const col = document.createElement('div');
          col.className = 'col-12 col-md-4';

          col.innerHTML = `
            <div class="preview-card platform-${p.classSuffix} h-100 d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex align-items-center gap-2 mb-2">
                  <i class="bi ${p.icon} fs-4 text-light"></i>
                  <h5 class="text-light fw-bold mb-0" style="font-size: 1rem;">${p.name}</h5>
                </div>
                <p class="text-secondary small mb-3">${p.desc}</p>
              </div>
              <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="btn btn-platform btn-${p.classSuffix} w-100 justify-content-center">
                Open Profile <i class="bi bi-box-arrow-up-right ms-1"></i>
              </a>
            </div>
          `;

          cardsGrid.appendChild(col);
        }
      });

      // Show container
      document.getElementById('previewContainer').classList.remove('d-none');
    });
  </script>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
