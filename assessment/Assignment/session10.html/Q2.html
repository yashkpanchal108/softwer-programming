// Design a Bootstrap Card to display a Flipkart-style product preview with an image, product name, price, and a 'Buy Now' button.


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Product Preview Card</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN for Rating Star -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container d-flex justify-content-center">
    <!-- Flipkart Product Card -->
    <div class="card shadow-sm border-0" style="width: 18rem;">
      
      <!-- Product Image -->
      <div class="text-center p-3">
        <img src="https://via.placeholder.com/200x200" class="card-img-top img-fluid" alt="Wireless Headphones" style="height: 180px; object-fit: contain;">
      </div>

      <!-- Card Content -->
      <div class="card-body pt-0">
        <!-- Brand / Subtitle -->
        <small class="text-muted fw-bold text-uppercase">Sony</small>
        
        <!-- Product Name -->
        <h6 class="card-title text-truncate fw-semibold mb-1" title="Sony WH-1000XM5 Wireless Headphones">
          Sony WH-1000XM5 Wireless Headphones
        </h6>

        <!-- Rating & Reviews -->
        <div class="mb-2 d-flex align-items-center gap-2">
          <span class="badge bg-success small">
            4.5 <i class="bi bi-star-fill"></i>
          </span>
          <small class="text-muted fw-semibold">(12,450)</small>
        </div>

        <!-- Pricing Section -->
        <div class="d-flex align-items-baseline gap-2 mb-3">
          <span class="fs-5 fw-bold text-dark">₹29,990</span>
          <span class="text-muted text-decoration-line-through small">₹34,990</span>
          <span class="text-success fw-bold small">14% off</span>
        </div>

        <!-- Buy Now Button -->
        <button class="btn btn-warning w-100 fw-bold text-dark border-0">
          Buy Now
        </button>
      </div>

    </div>
  </div>

</body>
</html>
