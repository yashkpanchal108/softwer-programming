// Use Bootstrap Buttons to create a row of filter buttons (e.g., 'All', 'Veg', 'Non-Veg', 'Desserts') for a food delivery app homepage. Highlight the selected filter using the 'active' class.


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Delivery Category Filters</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

  <div class="container my-4">
    <h5 class="fw-bold mb-3">Explore Categories</h5>

    <!-- Horizontal Scrollable Row for Mobile & Desktop -->
    <div class="d-flex flex-nowrap gap-2 overflow-auto pb-2">
      
      <!-- 'All' Filter (Selected / Active) -->
      <button type="button" class="btn btn-danger active rounded-pill px-4 fw-semibold flex-shrink-0">
        <i class="bi bi-grid-fill me-1"></i> All
      </button>

      <!-- 'Veg' Filter -->
      <button type="button" class="btn btn-outline-danger rounded-pill px-4 fw-semibold flex-shrink-0">
        <i class="bi bi-circle-fill text-success me-1"></i> Veg
      </button>

      <!-- 'Non-Veg' Filter -->
      <button type="button" class="btn btn-outline-danger rounded-pill px-4 fw-semibold flex-shrink-0">
        <i class="bi bi-triangle-fill text-danger me-1"></i> Non-Veg
      </button>

      <!-- 'Desserts' Filter -->
      <button type="button" class="btn btn-outline-danger rounded-pill px-4 fw-semibold flex-shrink-0">
        <i class="bi bi-cake2-fill me-1"></i> Desserts
      </button>

    </div>
  </div>

</body>
</html>
