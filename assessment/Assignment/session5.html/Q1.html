// Create an HTML file for a Flipkart-style product card and apply inline CSS to set a unique background color and font size for the product title only.

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flipkart Product Card</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f1eded; display: flex; justify-content: center; padding: 40px;">

  <!-- Product Card Container -->
  <div style="width: 280px; background-color: #ffffff; border-radius: 8px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center;">
    
    <!-- Product Image -->
    <img src="https://via.placeholder.com/200" alt="Wireless Headphones" style="width: 100%; height: auto; border-radius: 4px;">

    <!-- Product Title (Unique inline styles applied here) -->
    <h3 style="background-color: #fff8e1; font-size: 18px; color: #212121; padding: 8px 6px; margin: 12px 0 8px 0; border-radius: 4px; font-weight: 600;">
      Wireless Over-Ear Headphones
    </h3>

    <!-- Rating & Reviews -->
    <div style="margin-bottom: 8px;">
      <span style="background-color: #388e3c; color: #ffffff; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 3px;">
        4.4 ★
      </span>
      <span style="color: #878787; font-size: 13px; margin-left: 6px;">
        (2,450)
      </span>
    </div>

    <!-- Price Section -->
    <div style="font-size: 16px; margin-top: 6px;">
      <span style="font-weight: bold; color: #212121; font-size: 18px;">₹1,999</span>
      <span style="text-decoration: line-through; color: #878787; font-size: 14px; margin-left: 6px;">₹4,999</span>
      <span style="color: #388e3c; font-size: 13px; font-weight: bold; margin-left: 6px;">60% off</span>
    </div>

    <!-- Free Delivery Tag -->
    <p style="font-size: 12px; color: #000000; margin-top: 8px; font-weight: 500;">
      Free delivery
    </p>

  </div>

</body>
</html>
